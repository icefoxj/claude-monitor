# Builds every board's firmware and runs the host tests on every push and
# pull request. On a version tag it also attaches the images to the GitHub
# release for that tag and publishes the browser flasher page (AtomS3R).
# Run by hand with a release tag to (re)publish the flasher page for an
# existing release from its assets.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Existing release tag (e.g. v1.3.0) to publish the web flasher for; leave empty to just build"
        required: false
        default: ""

permissions:
  contents: write    # release assets
  pages: write       # web flasher
  id-token: write    # deploy-pages

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host-tests:
    name: monitor-core host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: bash tests/host/run.sh

  firmware:
    name: firmware ${{ matrix.board }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: atoms3r
            target: esp32s3
          - board: tab5
            target: esp32p4
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # tags, so the app version (git describe) is right

      - name: Build with ESP-IDF 5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5
          target: ${{ matrix.target }}
          path: firmware/${{ matrix.board }}

      - name: Collect the images
        run: |
          set -euo pipefail
          VERSION="$(git describe --tags --always)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          pip install --quiet esptool
          bash tools/collect-images.sh "firmware/${{ matrix.board }}" "${{ matrix.board }}" "$VERSION" dist

      - uses: actions/upload-artifact@v4
        with:
          name: claude-monitor-${{ matrix.board }}-${{ env.VERSION }}
          path: dist/
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  web-flasher:
    name: web flasher (GitHub Pages)
    needs: firmware
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Images from this tag build
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/download-artifact@v4
        with:
          pattern: claude-monitor-atoms3r-*
          path: dist
          merge-multiple: true

      - name: Images from the release ${{ inputs.release }}
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${{ inputs.release }}" --repo "${{ github.repository }}" --dir dist \
            --pattern 'claude-monitor-atoms3r-*'
          ls -l dist

      # Three parts at their offsets, not the merged image: the merged one
      # pads the gap over the NVS partition with 0xFF and would wipe a
      # stored calibration
      - name: Assemble the site
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.release }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          cd dist
          BOOT="$(ls claude-monitor-atoms3r-*-bootloader.bin | head -1)"
          PT="$(ls claude-monitor-atoms3r-*-partition-table.bin | head -1)"
          APP="$(ls claude-monitor-atoms3r-*.bin | grep -v -e '-merged' -e '-bootloader' -e '-partition-table' | head -1)"
          cd ..
          test -n "$BOOT" && test -n "$PT" && test -n "$APP"
          mkdir -p site
          cp docs/index.html site/
          cp "dist/$BOOT" "dist/$PT" "dist/$APP" site/
          cat > site/manifest.json <<EOF
          {
            "name": "claude-monitor for the M5Stack AtomS3R",
            "version": "$VERSION",
            "new_install_prompt_erase": false,
            "builds": [
              {
                "chipFamily": "ESP32-S3",
                "parts": [
                  { "path": "$BOOT", "offset": 0 },
                  { "path": "$PT",   "offset": 32768 },
                  { "path": "$APP",  "offset": 65536 }
                ]
              }
            ]
          }
          EOF
          sed -i "s/__VERSION__/$VERSION/g" site/index.html
          ls -l site
          cat site/manifest.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
